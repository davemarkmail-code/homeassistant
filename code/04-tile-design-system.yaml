# =============================================================================
#  THE TILE DESIGN SYSTEM
#  button-card templates shared across a wall tablet and a phone dashboard
# =============================================================================
#
#  REQUIRES: custom:button-card (HACS)
#  OPTIONAL: custom-brand-icons (HACS) for device logos — prefix phu:
#
#  THE PALETTE
#  -----------
#  Two colours do all the work, on a dark background:
#
#     linen   #ddd6c8   — a device that is OFF or at rest
#     olive   #94a860   — a device that is ON or ACTIVE
#     red     #ff5656   — used ONLY for warnings and "everything off"
#
#  Muted label variants (#cfc7b6 linen, #a9bd76 olive) keep text a shade below
#  the icon so the icon reads first.
#
#  Restricting yourself to two states makes a wall panel legible from across a
#  room. My earlier version used amber, brown, purple and teal for different
#  device categories and it looked like a fruit machine.
#
#  SIZING
#  ------
#     Wall tablet (iPad mini, ~1133×744):  tiles 150px, icons 54px, labels 16px
#     Phone (~390px wide):                 tiles 126px, icons 44px, labels 14px
#     Secondary tiles (favourites etc.):   tiles 104px, icons 34px, labels 13px
#
#  Put these under `button_card_templates:` at the ROOT of the dashboard config.
# =============================================================================

button_card_templates:

  # ---------------------------------------------------------------------------
  #  tile — the workhorse. Any toggleable thing: lights, fans, switches.
  # ---------------------------------------------------------------------------
  #  THE HVAC SUBTLETY, worth knowing:
  #  A climate entity's STATE is its MODE ('heat'), not whether it is currently
  #  calling for heat. So a thermostat set to heat shows "on" all summer. The
  #  attribute you actually want is hvac_action ('heating' / 'idle').
  #  This template prefers hvac_action when present and falls back to state.
  # ---------------------------------------------------------------------------
  tile:
    show_icon: true
    show_name: true
    show_state: false
    size: 54px
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    styles:
      card:
        - height: 150px
        - border-radius: 14px
        - box-shadow: none
        - padding: 6px
        - background: rgba(255,255,255,0.05)
        - border: 1px solid transparent
      icon:
        - color: |
            [[[
              var s = entity ? entity.state : '';
              var a = (entity && entity.attributes) ? entity.attributes.hvac_action : null;
              var on = a ? (a === 'heating' || a === 'cooling' || a === 'drying')
                         : (s === 'on' || s === 'open' || s === 'playing' || s === 'cleaning');
              return on ? '#94a860' : '#ddd6c8';
            ]]]
      name:
        - font-size: 16px
        - font-weight: 500
        - margin-top: 12px
        - color: |
            [[[
              var s = entity ? entity.state : '';
              var a = (entity && entity.attributes) ? entity.attributes.hvac_action : null;
              var on = a ? (a === 'heating' || a === 'cooling' || a === 'drying')
                         : (s === 'on' || s === 'open' || s === 'playing' || s === 'cleaning');
              return on ? '#a9bd76' : '#cfc7b6';
            ]]]

  # ---------------------------------------------------------------------------
  #  heading — a section label that doesn't look like a button
  # ---------------------------------------------------------------------------
  heading:
    show_icon: false
    show_name: true
    tap_action:
      action: none
    styles:
      card:
        - background: none
        - border: none
        - box-shadow: none
        - height: 38px
        - padding: 0 2px
        - justify-content: flex-start
        - align-items: flex-end
      name:
        - font-size: 16px
        - font-weight: 500
        - color: "#8b93a1"
        - text-align: left


# =============================================================================
#  ACTIVITY TILES  —  the single most useful idea in this document
# =============================================================================
#
#  THE MISTAKE EVERYBODY MAKES (I did)
#  -----------------------------------
#  You store "what are we doing" in an input_select, set it from each activity
#  script, and colour the tiles from that.
#
#  It lies. My input_select only ever held 'Fire TV' or 'Music', so when I added
#  a games console and a disc player, the MUSIC tile stayed lit while I was
#  playing Xbox. Worse, the stored value survives you turning everything off by
#  hand, so the dashboard cheerfully reports an activity that ended hours ago.
#
#  THE FIX
#  -------
#  Colour the tiles from the AMPLIFIER'S ACTUAL SOURCE. It is the one thing in
#  the room that always knows the truth, because it is physically switching the
#  signal. Only one tile can be lit, and it is right by construction.
#
#  You must match your amp's exact source strings, which are odd. Read them out
#  of your own receiver with the template editor:
#
#     {{ state_attr('media_player.lounge_receiver','source_list') }}
#
#  Mine, for example, are:
#     'VIDEO3 ··· GAME/TV ··· GAME'      (console)
#     'DVD ··· BD/DVD'                   (disc)
#     'STRM BOX'                         (streaming)
#     'CD ··· TV/CD'                     (speaker line-in)
#  Those are middle-dots, not full stops. Match on a distinctive FRAGMENT with a
#  regex rather than the whole string, and you'll save yourself some grief.
# =============================================================================

# Example: a streaming activity tile. Repeat per activity with its own regex.
- type: custom:button-card
  name: Streaming
  icon: phu:firetv                     # or mdi:play-box
  size: 54px
  show_state: false
  entity: media_player.lounge_receiver
  triggers_update:
    - media_player.lounge_receiver
    - script.lounge_streaming
  tap_action:
    action: call-service
    service: script.turn_on
    target:
      entity_id: script.lounge_streaming
  hold_action:
    action: none
  styles:
    card:
      - height: 150px
      - border-radius: 14px
      - box-shadow: none
      - padding: 6px
      - background: rgba(255,255,255,0.05)
      - border: 1px solid transparent
    icon:
      - color: |
          [[[
            var e = states['media_player.lounge_receiver'];
            var src = (e && e.attributes) ? (e.attributes.source || '') : '';
            var on = (e && e.state !== 'off' && e.state !== 'unavailable'
                        && e.state !== 'unknown' && /STRM/i.test(src));
            return on ? '#94a860' : '#ddd6c8';
          ]]]
    name:
      - font-size: 16px
      - font-weight: 500
      - margin-top: 12px
      - color: |
          [[[
            var e = states['media_player.lounge_receiver'];
            var src = (e && e.attributes) ? (e.attributes.source || '') : '';
            var on = (e && e.state !== 'off' && e.state !== 'unavailable'
                        && e.state !== 'unknown' && /STRM/i.test(src));
            return on ? '#a9bd76' : '#cfc7b6';
          ]]]
  # The loading spinner — see 06-spinner-and-progress-ring.md
  custom_fields:
    spin: |
      [[[
        var s = states['script.lounge_streaming'];
        if (!s || s.state !== 'on') return '';
        return '<div style="width:16px;height:16px;'
             + 'border:2px solid rgba(221,214,200,0.25);'
             + 'border-top-color:#ddd6c8;border-radius:50%;'
             + 'animation:dmspin 0.8s linear infinite"></div>'
             + '<style>@keyframes dmspin{to{transform:rotate(360deg)}}</style>';
      ]]]

# For a games console it is worth ALSO accepting the console's own state, since
# it may be on while you're watching something else:
#
#   var rxOn  = /GAME/i.test(src) && receiver is on;
#   var conOn = console state is not off/unavailable/unknown;
#   var on    = rxOn || conOn;


# =============================================================================
#  DYNAMIC HEADINGS  —  make hidden state visible
# =============================================================================
#  If you build a mode selector (like the audio zone ticks in
#  02-battery-and-audio-scripts.yaml), the mode MUST be visible somewhere or
#  users will think the buttons are broken. A templated heading is the cheapest
#  possible fix and it works beautifully.
# =============================================================================

- type: custom:button-card
  template: heading
  triggers_update:
    - input_boolean.zone_lounge
    - input_boolean.zone_kitchen
  name: |
    [[[
      var l = (states['input_boolean.zone_lounge'] || {}).state === 'on';
      var k = (states['input_boolean.zone_kitchen'] || {}).state === 'on';
      if (l && k) return 'Favourites - both rooms';
      if (l)      return 'Favourites - lounge';
      if (k)      return 'Favourites - kitchen';
      return 'Favourites - tick a room above first';
    ]]]


# =============================================================================
#  A WARNING BADGE  —  low storage, filter life, anything with a threshold
# =============================================================================
#  Sits in the corner of an existing tile and appears only when it matters, so
#  it costs nothing visually until it earns its place.
#
#  Note it shows the NUMBER, not just "LOW" — the difference between mildly
#  annoying and genuinely urgent.
# =============================================================================

custom_fields:
  lowspace: |
    [[[
      var f = parseFloat((states['sensor.console_free_space'] || {}).state);
      if (isNaN(f) || f >= 20) return '';
      return '<div style="display:flex;align-items:center;gap:3px;">'
           + '<ha-icon icon="mdi:harddisk" style="--mdc-icon-size:14px;'
           + 'width:14px;height:14px;color:#ff5656"></ha-icon>'
           + '<span style="font:600 9px Roboto,sans-serif;color:#ff5656;'
           + 'letter-spacing:0.3px;">LOW ' + Math.round(f) + 'GB</span></div>';
    ]]]
styles:
  custom_fields:
    lowspace:
      - position: absolute
      - top: 10px
      - right: 12px
      - z-index: 6
      - pointer-events: none


# =============================================================================
#  LAYOUT NOTES THAT COST ME TIME
# =============================================================================
#
#  PANEL vs MASONRY
#  On a WALL TABLET, use `type: panel` with a vertical-stack inside. Masonry
#  caps column width, which squeezed my 150px tiles down to about 117px and
#  wasted a third of the screen.
#  On a PHONE, masonry is fine — the screen is narrower than the cap anyway,
#  and you get simpler config.
#
#  SUBVIEWS
#  Set `subview: true` on detail pages (a cleaning room-picker, a music page).
#  They stay out of the tab bar and gain a proper back arrow. Your top-level
#  navigation stays as short as it should be.
#
#  DON'T HIDE ACTIONS BEHIND HOLD
#  I put "open the music page" on hold_action of the Music tile. A deliberate
#  press tips over Home Assistant's ~500ms hold threshold, so tapping Music
#  navigated instead of playing music. I caught myself out with my own
#  dashboard. If an action matters, give it a visible tile.
#
#  ONE-WAY DEVICES
#  Radio-controlled blinds (Somfy RTS and similar) report state 'unknown'
#  forever, because there is no feedback channel. Use explicit open/close
#  actions rather than toggle, and don't try to colour them by state.
# =============================================================================
