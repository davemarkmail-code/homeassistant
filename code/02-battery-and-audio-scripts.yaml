# =============================================================================
#  BATTERY MODE CONTROL  +  MULTI-ROOM AUDIO ZONES
# =============================================================================


# =============================================================================
#  PART 1 — HOME BATTERY MODE PICKER
# =============================================================================
#
#  A solar battery generally has three useful states:
#
#    IMPORT  — force charge from the grid (cheap overnight rate)
#    EXPORT  — force discharge to the grid (paid export, or a grid event)
#    ECO     — normal self-consumption; charge from solar, power the house
#
#  These are CONSEQUENTIAL controls. Getting them wrong costs real money, so:
#
#    * each script is a TOGGLE — pressing IMPORT while importing cancels it
#    * IMPORT and EXPORT have a confirmation on the dashboard tile
#    * ECO has NO confirmation, so panicking out is always one tap
#    * build and trace-test before wiring to a real button
#
#  Entity names below follow the GivTCP add-on's convention for GivEnergy kit.
#  Adapt to your own inverter integration; the shape is what matters.
# =============================================================================

battery_force_charge:
  alias: Battery - force charge (toggle)
  icon: mdi:transmission-tower-import
  description: >
    Charges from the grid. Pressing again cancels and returns to normal.
  mode: single
  sequence:
    - choose:
        # Already force-charging → cancel
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('select.inverter_force_charge','Running') }}
          sequence:
            - action: select.select_option
              target:
                entity_id: select.inverter_force_charge
              data:
                option: "Cancel"
      # Otherwise: stop any forced export first, then start charging
      default:
        - action: select.select_option
          target:
            entity_id: select.inverter_force_export
          data:
            option: "Cancel"
          continue_on_error: true
        - delay:
            seconds: 1
        - action: select.select_option
          target:
            entity_id: select.inverter_force_charge
          data:
            option: "180"        # minutes; adjust to taste
          continue_on_error: true


battery_force_export:
  alias: Battery - force export (toggle)
  icon: mdi:transmission-tower-export
  description: >
    Discharges to the grid. Pressing again cancels.
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('select.inverter_force_export','Running') }}
          sequence:
            - action: select.select_option
              target:
                entity_id: select.inverter_force_export
              data:
                option: "Cancel"
      default:
        - action: select.select_option
          target:
            entity_id: select.inverter_force_charge
          data:
            option: "Cancel"
          continue_on_error: true
        - delay:
            seconds: 1
        - action: select.select_option
          target:
            entity_id: select.inverter_force_export
          data:
            option: "180"
          continue_on_error: true


battery_eco_mode:
  alias: Battery - back to Eco
  icon: mdi:leaf
  description: >
    Cancels any forced mode and returns to normal self-consumption.
    Deliberately has NO confirmation dialogue — this is the bail-out button.
  mode: single
  sequence:
    - action: select.select_option
      target:
        entity_id: select.inverter_force_charge
      data:
        option: "Cancel"
      continue_on_error: true
    - action: select.select_option
      target:
        entity_id: select.inverter_force_export
      data:
        option: "Cancel"
      continue_on_error: true
    - delay:
        seconds: 1
    - action: select.select_option
      target:
        entity_id: select.inverter_mode
      data:
        option: "Eco"
      continue_on_error: true
    - action: switch.turn_on
      target:
        entity_id: switch.inverter_eco_mode
      continue_on_error: true


# =============================================================================
#  PART 2 — MULTI-ROOM AUDIO: A ZONE PICKER
# =============================================================================
#
#  THE PROBLEM
#  -----------
#  With two speakers you want three behaviours: play here, play there, or play
#  in both. Putting a favourites row under each speaker means duplicating every
#  tile, and it still doesn't give you "both".
#
#  THE APPROACH
#  ------------
#  Mimic the manufacturer's own app: TICK the rooms you want, then pick what to
#  play. Two input_booleans hold the selection; one script does the work.
#
#  Create these helpers first (Settings → Devices & Services → Helpers):
#     input_boolean.zone_lounge
#     input_boolean.zone_kitchen
#
#  UX WARNING, learned the hard way: a mode selector that does nothing visible
#  when you tap it feels broken. Make the favourites heading DYNAMIC so it reads
#  "Favourites — both rooms" or "Favourites — tick a room first". See
#  05-button-card-templates.yaml for that.
# =============================================================================

sonos_play_favourite:
  alias: Audio - play favourite to selected zones
  icon: mdi:playlist-music
  description: >
    Plays the given favourite to whichever zones are ticked, grouping the
    speakers automatically when both are selected.
  mode: restart
  fields:
    source:
      description: Name of the favourite, exactly as it appears in source_list
      example: "Chill"
      required: true
      selector:
        text:
  sequence:
    - choose:

        # --- Both rooms: group them, then play on the master --------------
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('input_boolean.zone_lounge','on')
                   and is_state('input_boolean.zone_kitchen','on') }}
          sequence:
            - action: media_player.join
              target:
                entity_id: media_player.lounge_speaker      # master
              data:
                group_members:
                  - media_player.kitchen_speaker
              continue_on_error: true
            - delay:
                seconds: 1
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_speaker
              data:
                source: "{{ source }}"

        # --- Lounge only: ungroup first so it can't hijack the other room --
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('input_boolean.zone_lounge','on')
                   and not is_state('input_boolean.zone_kitchen','on') }}
          sequence:
            - action: media_player.unjoin
              target:
                entity_id: media_player.kitchen_speaker
              continue_on_error: true
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_speaker
              data:
                source: "{{ source }}"

        # --- Kitchen only -------------------------------------------------
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('input_boolean.zone_kitchen','on')
                   and not is_state('input_boolean.zone_lounge','on') }}
          sequence:
            - action: media_player.unjoin
              target:
                entity_id: media_player.kitchen_speaker
              continue_on_error: true
            - action: media_player.select_source
              target:
                entity_id: media_player.kitchen_speaker
              data:
                source: "{{ source }}"

      # Nothing ticked → do nothing at all
      default: []


# -----------------------------------------------------------------------------
#  Simple group toggle, if you'd rather not bother with zone ticks
# -----------------------------------------------------------------------------
#  Cleverness worth having: whichever speaker is already PLAYING becomes the
#  master, so the music you can hear is the music that spreads — not the other
#  room's silence overwriting it.
# -----------------------------------------------------------------------------
audio_group_toggle:
  alias: Audio - group/ungroup the two rooms
  icon: mdi:speaker-multiple
  description: >
    Joins the second speaker to the first, or splits them if already grouped.
  mode: single
  sequence:
    - choose:

        # Already grouped → split
        - conditions:
            - condition: template
              value_template: >
                {{ 'media_player.kitchen_speaker'
                     in state_attr('media_player.lounge_speaker','group_members')
                   or 'media_player.lounge_speaker'
                     in state_attr('media_player.kitchen_speaker','group_members') }}
          sequence:
            - action: media_player.unjoin
              target:
                entity_id: media_player.kitchen_speaker
              continue_on_error: true

        # Kitchen is the one playing → make IT the master
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('media_player.kitchen_speaker','playing')
                   and not is_state('media_player.lounge_speaker','playing') }}
          sequence:
            - action: media_player.join
              target:
                entity_id: media_player.kitchen_speaker
              data:
                group_members:
                  - media_player.lounge_speaker
              continue_on_error: true

      # Otherwise the lounge leads
      default:
        - action: media_player.join
          target:
            entity_id: media_player.lounge_speaker
          data:
            group_members:
              - media_player.kitchen_speaker
          continue_on_error: true

# -----------------------------------------------------------------------------
#  NOTES ON GROUPED AUDIO
# -----------------------------------------------------------------------------
#  * Volumes stay INDEPENDENT when grouped. That is usually what you want —
#    the group shares the music, not the level.
#  * Pausing the MASTER pauses both. That is the platform's behaviour, not
#    something you can configure away.
#  * Favourites are account-wide, so both speakers expose the same source_list.
#    Each speaker's own physical input ("TV", "Line-in") appears in that list
#    too and should be filtered out of any favourites row you generate.
# -----------------------------------------------------------------------------
