# =============================================================================
#  AV ACTIVITY SCRIPTS  —  the "one tap, whole room" pattern
# =============================================================================
#
#  WHY THIS EXISTS
#  ---------------
#  A single "watch telly" action has to touch three or four devices: wake the
#  TV, power the amplifier, switch the amp to the right input, wake the source
#  device, and stop whatever was playing before.
#
#  Written sequentially, that takes 20–40 seconds, because you end up waiting
#  for the TV before you even start on the amp.
#
#  Written as PARALLEL BRANCHES, the whole thing takes as long as the slowest
#  single device — usually the TV's own wake time. Same result, a third of the
#  wait.
#
#  THE RULES THAT MATTER
#  ---------------------
#  * mode: restart          — tapping twice restarts cleanly instead of queueing
#  * continue_on_error      — one dead device must not abandon the whole script
#  * continue_on_timeout    — a slow TV should not block the amp
#  * wait_template          — wait for the device to be READY, don't guess delays
#  * pause other audio      — see the "silent playback" note at the bottom
#
#  Replace entity IDs and source strings with your own. The source strings must
#  match your amplifier EXACTLY — see 09-solar-flow-card-notes.md for how to
#  read them out of your own receiver.
# =============================================================================


# -----------------------------------------------------------------------------
#  STREAMING BOX  (Fire Stick, Apple TV, Chromecast …)
# -----------------------------------------------------------------------------
lounge_streaming:
  alias: Lounge - Streaming
  icon: mdi:play-box
  description: >
    TV wake, receiver and streaming box all started in parallel.
  mode: restart
  sequence:
    # Remember which activity is live (useful for dashboards and conditions)
    - action: input_select.select_option
      target:
        entity_id: input_select.lounge_media_activity
      data:
        option: Streaming
      continue_on_error: true

    - parallel:

        # --- Branch A: the television -------------------------------------
        - sequence:
            - action: wake_on_lan.send_magic_packet
              data:
                mac: "AA:BB:CC:DD:EE:FF"        # your TV's MAC
              continue_on_error: true
            - wait_template: >
                {{ states('media_player.lounge_tv')
                   not in ['off','unavailable','unknown'] }}
              timeout:
                seconds: 18
              continue_on_timeout: true
            # Small settle: webOS accepts the wake but not yet a source change
            - delay:
                milliseconds: 600
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_tv
              data:
                source: "AV Receiver"           # your TV's input label
              continue_on_error: true

        # --- Branch B: the amplifier --------------------------------------
        - sequence:
            - action: media_player.turn_on
              target:
                entity_id: media_player.lounge_receiver
              continue_on_error: true
            - wait_template: >
                {{ states('media_player.lounge_receiver')
                   not in ['off','unavailable','unknown'] }}
              timeout:
                seconds: 8
              continue_on_timeout: true
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_receiver
              data:
                source: "STRM BOX"              # EXACT string from your amp
              continue_on_error: true

        # --- Branch C: the source device ----------------------------------
        - sequence:
            - action: media_player.turn_on
              target:
                entity_id: media_player.streaming_box
              continue_on_error: true
            - action: remote.send_command
              target:
                entity_id: remote.streaming_box
              data:
                command: HOME
              continue_on_error: true

        # --- Branch D: stop music, so it can't play on silently ------------
        - sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ states('media_player.lounge_speaker')
                       in ['playing','buffering'] }}
              then:
                - action: media_player.media_pause
                  target:
                    entity_id: media_player.lounge_speaker
                  continue_on_error: true


# -----------------------------------------------------------------------------
#  MUSIC  —  note this one deliberately turns the TV OFF
# -----------------------------------------------------------------------------
#  Music through a networked speaker doesn't need a screen. Killing the TV
#  saves power and avoids a bright rectangle in a dark room.
#
#  ORDER MATTERS HERE. If a games console or streaming box is still awake and
#  pushing HDMI, the TV will ignore a standby command or wake straight back up.
#  So: sleep the source first, pause, THEN turn the TV off.
# -----------------------------------------------------------------------------
lounge_music:
  alias: Lounge - Music
  icon: mdi:music
  description: >
    Sleeps the console, drops the TV, then puts the amp on the speaker input.
  mode: restart
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.lounge_media_activity
      data:
        option: Music
      continue_on_error: true

    # Console first — while it is awake the TV won't stay off
    - if:
        - condition: template
          value_template: >
            {{ states('media_player.games_console')
               not in ['off','unavailable','unknown'] }}
      then:
        - action: media_player.turn_off
          target:
            entity_id: media_player.games_console
          continue_on_error: true

    # Let HDMI go quiet before asking the TV to sleep
    - delay:
        seconds: 2

    - if:
        - condition: template
          value_template: >
            {{ states('media_player.lounge_tv')
               not in ['off','unavailable','unknown'] }}
      then:
        - action: media_player.turn_off
          target:
            entity_id: media_player.lounge_tv
          continue_on_error: true

    - action: media_player.turn_on
      target:
        entity_id: media_player.lounge_receiver
      continue_on_error: true
    - delay: "00:00:01"
    - action: media_player.select_source
      target:
        entity_id: media_player.lounge_receiver
      data:
        source: "CD ··· TV/CD"                  # EXACT string from your amp
      continue_on_error: true

    # NOTE: this script does NOT start playback. That is deliberate — you pick
    # what to play from a favourites tile. If you want it to resume whatever
    # was last queued, add:
    #   - action: media_player.media_play
    #     target: { entity_id: media_player.lounge_speaker }


# -----------------------------------------------------------------------------
#  GAMES CONSOLE  —  including the wake problem
# -----------------------------------------------------------------------------
#  IMPORTANT: standard wake-on-LAN magic packets DO NOT wake an Xbox. It uses
#  Microsoft's own protocol. Use the official integration's remote entity and
#  send its WakeUp command instead. Guard it so tapping the tile mid-game does
#  nothing.
#
#  The console must be in SLEEP power mode, not energy-saving.
# -----------------------------------------------------------------------------
lounge_console:
  alias: Lounge - Console
  icon: mdi:microsoft-xbox
  description: >
    Wakes the console properly, TV and receiver to the game input, in parallel.
  mode: restart
  sequence:
    - parallel:

        # --- Branch A: the console ----------------------------------------
        - sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ states('media_player.games_console')
                       in ['off','unavailable','unknown','standby'] }}
              then:
                - action: remote.turn_on
                  target:
                    entity_id: remote.games_console
                  continue_on_error: true
                - delay:
                    seconds: 2
                - action: remote.send_command
                  target:
                    entity_id: remote.games_console
                  data:
                    command: WakeUp
                  continue_on_error: true

        # --- Branch B: the television -------------------------------------
        - sequence:
            - action: wake_on_lan.send_magic_packet
              data:
                mac: "AA:BB:CC:DD:EE:FF"
              continue_on_error: true
            - wait_template: >
                {{ states('media_player.lounge_tv')
                   not in ['off','unavailable','unknown'] }}
              timeout:
                seconds: 18
              continue_on_timeout: true
            - delay:
                milliseconds: 600
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_tv
              data:
                source: "AV Receiver"
              continue_on_error: true

        # --- Branch C: the amplifier --------------------------------------
        - sequence:
            - action: media_player.turn_on
              target:
                entity_id: media_player.lounge_receiver
              continue_on_error: true
            - wait_template: >
                {{ states('media_player.lounge_receiver')
                   not in ['off','unavailable','unknown'] }}
              timeout:
                seconds: 8
              continue_on_timeout: true
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_receiver
              data:
                source: "VIDEO3 ··· GAME/TV ··· GAME"
              continue_on_error: true

        # --- Branch D: stop music -----------------------------------------
        - sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ states('media_player.lounge_speaker')
                       in ['playing','buffering'] }}
              then:
                - action: media_player.media_pause
                  target:
                    entity_id: media_player.lounge_speaker
                  continue_on_error: true


# -----------------------------------------------------------------------------
#  DISC PLAYER  —  driven by infrared, because it has no network control
# -----------------------------------------------------------------------------
#  Cheap trick: a smart IR blaster (SwitchBot Hub and similar) gives you power
#  control over anything with a remote. It is ONE-WAY, so the entity's state
#  will always read 'unknown' — you can send but never confirm.
# -----------------------------------------------------------------------------
lounge_disc:
  alias: Lounge - Disc player
  icon: mdi:disc-player
  description: >
    TV and receiver to the disc input; player powered by IR blaster.
  mode: restart
  sequence:
    - parallel:
        - sequence:
            - action: wake_on_lan.send_magic_packet
              data:
                mac: "AA:BB:CC:DD:EE:FF"
              continue_on_error: true
            - wait_template: >
                {{ states('media_player.lounge_tv')
                   not in ['off','unavailable','unknown'] }}
              timeout:
                seconds: 18
              continue_on_timeout: true
            - delay:
                milliseconds: 600
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_tv
              data:
                source: "AV Receiver"
              continue_on_error: true

        - sequence:
            - action: media_player.turn_on
              target:
                entity_id: media_player.lounge_receiver
              continue_on_error: true
            - wait_template: >
                {{ states('media_player.lounge_receiver')
                   not in ['off','unavailable','unknown'] }}
              timeout:
                seconds: 8
              continue_on_timeout: true
            - action: media_player.select_source
              target:
                entity_id: media_player.lounge_receiver
              data:
                source: "DVD ··· BD/DVD"
              continue_on_error: true

        # IR power — fire and hope, there is no feedback
        - sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.disc_player_ir
              continue_on_error: true

        - sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ states('media_player.lounge_speaker')
                       in ['playing','buffering'] }}
              then:
                - action: media_player.media_pause
                  target:
                    entity_id: media_player.lounge_speaker
                  continue_on_error: true


# -----------------------------------------------------------------------------
#  EVERYTHING OFF
# -----------------------------------------------------------------------------
#  THE BUG THIS FIXES — worth reading even if you skip everything else.
#
#  My original version turned off the TV, the streaming box and the amplifier,
#  and I was pleased with it. It did not pause the SPEAKER.
#
#  One night I pressed it at 01:33 with music playing. The music kept streaming
#  silently, because the amp was off. At 02:59 the amplifier powered itself on
#  (its own quirk, unrelated) and the house filled with Bruce Springsteen. I
#  woke at 04:44 wondering what on earth was happening.
#
#  So: PAUSE AUDIO FIRST, before anything else. If it can play silently, one
#  day it will play loudly at the worst possible moment.
# -----------------------------------------------------------------------------
lounge_all_off:
  alias: Lounge - Everything off
  icon: mdi:power
  description: >
    Pauses audio first, then sleeps every source and finally the TV and amp.
  mode: restart
  sequence:
    # 1. MUSIC FIRST. Always.
    - if:
        - condition: template
          value_template: >
            {{ states('media_player.lounge_speaker')
               in ['playing','buffering'] }}
      then:
        - action: media_player.media_pause
          target:
            entity_id: media_player.lounge_speaker
          continue_on_error: true

    # 2. Console to sleep (guarded, so it isn't woken just to be slept)
    - if:
        - condition: template
          value_template: >
            {{ states('media_player.games_console')
               not in ['off','unavailable','unknown'] }}
      then:
        - action: media_player.turn_off
          target:
            entity_id: media_player.games_console
          continue_on_error: true

    # 3. Streaming box: send it HOME first so it isn't left mid-playback
    - action: media_player.turn_off
      target:
        entity_id: media_player.streaming_box
      continue_on_error: true
    - action: remote.send_command
      target:
        entity_id: remote.streaming_box
      data:
        command: HOME
      continue_on_error: true

    - wait_template: >
        {{ states('media_player.streaming_box') in ['off','standby','idle'] }}
      timeout:
        seconds: 6
      continue_on_timeout: true

    # 4. Amplifier, then a pause, then the TV
    - action: media_player.turn_off
      target:
        entity_id: media_player.lounge_receiver
      continue_on_error: true
    - delay:
        seconds: 2
    - action: media_player.turn_off
      target:
        entity_id: media_player.lounge_tv
      continue_on_error: true

    # 5. Retry loop — some TVs ignore the first standby if they were mid-wake
    - repeat:
        count: 3
        sequence:
          - delay:
              seconds: 3
          - if:
              - condition: template
                value_template: >
                  {{ states('media_player.lounge_tv')
                     not in ['off','unavailable','unknown'] }}
            then:
              - action: media_player.turn_off
                target:
                  entity_id: media_player.lounge_tv
                continue_on_error: true
